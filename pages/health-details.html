<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PawSense | Health Details</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body class="health-details-page">


    <!-- NAVBAR -->

    <nav class="main-nav">

        <div class="logo">
            🐾 PawSense
        </div>

        <a href="health.html"
           class="back-link">
            ← Back
        </a>

    </nav>


    <!-- HEADING -->

    <section class="health-details-heading">

        <p>🐾 PAWSENSE CARE</p>

        <h1 id="healthDetailsPetName">
            Pet Health
        </h1>

        <span id="healthDetailsPetInfo">
            Health information
        </span>

    </section>


    <!-- SAVED DETAILS -->

    <div class="health-info-box">


        <div class="health-info-card">

            <h2>🐾 Basic Information</h2>

            <p>
                <strong>Pet Name:</strong>
                <span id="detailPetName">-</span>
            </p>

            <p>
                <strong>Pet Type:</strong>
                <span id="detailPetType">-</span>
            </p>

            <p>
                <strong>Age:</strong>
                <span id="detailPetAge">-</span>
            </p>

            <p>
                <strong>Gender:</strong>
                <span id="detailPetGender">-</span>
            </p>

            <p>
                <strong>Breed:</strong>
                <span id="detailPetBreed">-</span>
            </p>

        </div>



        <div class="health-info-card">

            <h2>❤️ Health Information</h2>

            <p>
                <strong>Weight:</strong>
                <span id="detailWeight">-</span>
            </p>

            <p>
                <strong>Height:</strong>
                <span id="detailHeight">-</span>
            </p>

            <p>
                <strong>Temperature:</strong>
                <span id="detailTemperature">-</span>
            </p>

            <p>
                <strong>Health Status:</strong>
                <span id="detailHealthStatus">-</span>
            </p>

            <p>
                <strong>Diet:</strong>
                <span id="detailDiet">-</span>
            </p>

            <p>
                <strong>Allergies:</strong>
                <span id="detailAllergies">-</span>
            </p>

            <p>
                <strong>Activity:</strong>
                <span id="detailActivity">-</span>
            </p>

            <p>
                <strong>Symptoms / Notes:</strong>
                <span id="detailSymptoms">-</span>
            </p>

        </div>



        <!-- SHARE BUTTON -->

        <button
            type="button"
            class="save-health-btn"
            onclick="shareWithDoctor()">

            👨‍⚕️ Share Details with Doctor →

        </button>


    </div>


    <script src="../js/script.js"></script>

</body>

</html>
