<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Add Pet Details</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pet-details-page">

    <div class="pet-form-box">

        <div class="pet-icon">
            🐾
        </div>

        <p class="small-title">
            🐾 PAWSENSE CARE
        </p>

        <h1>
            Add Pet Details
        </h1>

        <p class="subtitle">
            Enter your pet's health information 💕
        </p>


        <form onsubmit="savePet(event)">

            <label>
                Pet Name
            </label>

            <input
                type="text"
                id="petName"
                placeholder="e.g. Bruno"
                required
            >


            <label>
                Pet Type
            </label>

            <select id="petType" required>

                <option value="">
                    Select Pet Type
                </option>

                <option value="Dog">
                    🐶 Dog
                </option>

                <option value="Cat">
                    🐱 Cat
                </option>

                <option value="Rabbit">
                    🐰 Rabbit
                </option>

                <option value="Bird">
                    🐦 Bird
                </option>

                <option value="Other">
                    🐾 Other
                </option>

            </select>


            <label>
                Age
            </label>

            <input
                type="number"
                id="petAge"
                placeholder="Enter age"
                min="0"
                required
            >


            <label>
                Gender
            </label>

            <select id="petGender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>


            <label>
                Breed
            </label>

            <input
                type="text"
                id="petBreed"
                placeholder="e.g. Labrador"
            >


            <label>
                Weight (kg)
            </label>

            <input
                type="number"
                id="petWeight"
                placeholder="e.g. 12"
                min="0"
                step="0.1"
                required
            >


            <label>
                Height (cm)
            </label>

            <input
                type="number"
                id="petHeight"
                placeholder="e.g. 45"
                min="0"
                step="0.1"
            >


            <label>
                Temperature (°C)
            </label>

            <input
                type="number"
                id="petTemperature"
                placeholder="e.g. 38.5"
                step="0.1"
            >


            <label>
                Health Status
            </label>

            <select id="healthStatus">

                <option value="Healthy">
                    Healthy
                </option>

                <option value="Needs Attention">
                    Needs Attention
                </option>

                <option value="Under Treatment">
                    Under Treatment
                </option>

            </select>


            <label>
                Diet
            </label>

            <input
                type="text"
                id="petDiet"
                placeholder="e.g. Dry food, homemade food"
            >


            <label>
                Allergies
            </label>

            <input
                type="text"
                id="petAllergies"
                placeholder="Enter allergies if any"
            >


            <label>
                Activity
            </label>

            <input
                type="text"
                id="petActivity"
                placeholder="e.g. Active, moderate"
            >


            <label>
                Symptoms
            </label>

            <input
                type="text"
                id="petSymptoms"
                placeholder="Enter symptoms if any"
            >


            <button
                type="submit"
                class="save-pet-btn">

                🐾 Save Pet

            </button>

        </form>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
