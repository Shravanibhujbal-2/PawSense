<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Create Account</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="register-page">

    <div class="register-container">

        <!-- LEFT SIDE -->

        <div class="register-left">

            <div class="register-logo">
                🐾 PawSense
            </div>

            <div class="register-pet">
                🐾
            </div>

            <h1>
                Start Your Pet Care Journey! 🐾
            </h1>

            <p>
                Create your PawSense account and
                take better care of your furry friend.
            </p>

        </div>


        <!-- REGISTER FORM -->

        <div class="register-box">

            <div class="register-title">

                <span>🐾</span>

                <h2>Create Account</h2>

                <p>
                    Join PawSense today
                </p>

            </div>


            <form onsubmit="registerUser(event)">

                <!-- NAME -->

                <label>Full Name</label>

                <div class="input-box">

                    <span>👤</span>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <label>Email Address</label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <label>Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <label>Confirm Password</label>

                <div class="input-box">

                    <span>🔐</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button type="submit" class="paw-login-button">

                    <span>🐾</span>

                    Create Account

                    <span>→</span>

                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a href="../index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
