<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Add Pet</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pet-details-page">

    <div class="pet-form-box">

        <div class="pet-icon">
            🐶
        </div>

        <p class="small-title">🐾 PAWSENSE CARE</p>

        <h1>Add Your Pet</h1>

        <p class="subtitle">
            Tell us a little about your best friend 💕
        </p>


        <form onsubmit="savePet(event)">

            <label>Pet Name</label>

            <input
                type="text"
                id="petName"
                placeholder="e.g. Bruno"
                required
            >


            <label>Pet Type</label>

            <select id="petType" required>

                <option value="">Select Pet Type</option>

                <option value="Dog">🐶 Dog</option>

                <option value="Cat">🐱 Cat</option>

                <option value="Rabbit">🐰 Rabbit</option>

                <option value="Bird">🐦 Bird</option>

                <option value="Other">🐾 Other</option>

            </select>


            <label>Age</label>

            <input
                type="number"
                id="petAge"
                placeholder="Enter age"
                min="0"
                required
            >


            <label>Gender</label>

            <select id="petGender" required>

                <option value="">Select Gender</option>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

            </select>


            <label>Breed</label>

            <input
                type="text"
                id="petBreed"
                placeholder="e.g. Labrador"
            >


            <button type="submit" class="save-pet-btn">

                🐾 Save Pet & Continue →

            </button>

        </form>

    </div>


    <script src="../js/script.js"></script>

</body>
</html>
