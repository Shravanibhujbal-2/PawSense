<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Reset Password</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body class="forgot-page">


    <div class="forgot-container">


        <!-- LEFT SIDE -->

        <div class="forgot-left">

            <div class="forgot-logo">
                🐾 PawSense
            </div>

            <div class="forgot-pet">
                🐾
            </div>

            <h1>
                Forgot Your Password? 🔐
            </h1>

            <p>
                Don't worry! You can create a new
                password and continue taking care
                of your furry friend.
            </p>

        </div>


        <!-- RESET FORM -->

        <div class="forgot-box">


            <div class="forgot-title">

                <span>🔐</span>

                <h2>Reset Password</h2>

                <p>
                    Create a new password
                </p>

            </div>


            <form onsubmit="resetPassword(event)">


                <!-- EMAIL -->

                <label>
                    Registered Email
                </label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <label>
                    New Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <label>
                    Confirm Password
                </label>

                <div class="input-box">

                    <span>🔐</span>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="paw-login-button"
                >

                    <span>🐾</span>

                    Reset Password

                    <span>→</span>

                </button>


            </form>


            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
