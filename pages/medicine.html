<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PawSense | Pet Medicine Shop</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<nav class="main-nav">

    <div class="logo">
        🐾 PawSense
    </div>

    <a href="store.html"
       class="back-link">
        ← Store
    </a>

</nav>


<div class="category-page">


    <div class="category-big-icon">
        💊
    </div>


    <h1>Pet Medicine Shop</h1>

    <p>
        Medicines and health products available for purchase
    </p>


    <div class="shop-grid">


        <!-- PRODUCT 1 -->

        <div class="shop-card">

            <div class="shop-icon">
                💊
            </div>

            <h2>
                Vitamin Supplement
            </h2>

            <p>
                Nutritional supplement for pets
            </p>

            <h3>
                ₹299
            </h3>

            <button
                class="shop-button"
                onclick="shopNow('Vitamin Supplement')">

                🛍️ Shop Now

            </button>

            <br><br>

            <button
                class="shop-button"
                onclick="addToCart('Vitamin Supplement', 299)">

                🛒 Add to Cart

            </button>

        </div>


        <!-- PRODUCT 2 -->

        <div class="shop-card">

            <div class="shop-icon">
                ❤️
            </div>

            <h2>
                Joint Support
            </h2>

            <p>
                Nutritional support for healthy joints
            </p>

            <h3>
                ₹399
            </h3>

            <button
                class="shop-button"
                onclick="shopNow('Joint Support')">

                🛍️ Shop Now

            </button>

            <br><br>

            <button
                class="shop-button"
                onclick="addToCart('Joint Support', 399)">

                🛒 Add to Cart

            </button>

        </div>


        <!-- PRODUCT 3 -->

        <div class="shop-card">

            <div class="shop-icon">
                🩹
            </div>

            <h2>
                Pet First Aid Kit
            </h2>

            <p>
                Basic first aid supplies for pets
            </p>

            <h3>
                ₹349
            </h3>

            <button
                class="shop-button"
                onclick="shopNow('Pet First Aid Kit')">

                🛍️ Shop Now

            </button>

            <br><br>

            <button
                class="shop-button"
                onclick="addToCart('Pet First Aid Kit', 349)">

                🛒 Add to Cart

            </button>

        </div>


    </div>


    <br><br>


    <button
        class="shop-button"
        onclick="window.location.href='cart.html'">

        🛒 View Cart

    </button>


</div>


<script>

function shopNow(productName) {

    alert(
        "You selected " +
        productName +
        " 🛍️"
    );

}


function addToCart(productName, price) {

    alert(
        productName +
        " added to cart! 🛒"
    );

}

</script>


</body>

</html>
