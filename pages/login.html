<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="login-logo">
                🐾 PawSense
            </div>

            <div class="big-pet">
               🐾
            </div>

            <h1>
                Welcome Back! 👋
            </h1>

            <p>
                Your furry friend is waiting for you.
            </p>

            <div class="paw-message">
                🐾 Let's take care of them together!
            </div>

        </div>


        <!-- LOGIN FORM -->

        <div class="login-box">

            <div class="login-title">

                <span>🐾</span>

                <h2>Welcome Back!</h2>

                <p>
                    Login to your PawSense account
                </p>

            </div>


            <form onsubmit="loginUser(event)">

                <!-- EMAIL -->

                <label>Email Address</label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <label>Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="paw-login-button">

                    <span>🐾</span>

                    Enter PawSense

                    <span>→</span>

                </button>

            </form>


            <!-- REGISTER LINK -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- HOME -->

            <a href="../index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="../js/script.js"></script>

</body>

</html>
