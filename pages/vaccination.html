<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Vaccination</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="main-nav">

    <div class="logo">
        🐾 PawSense
    </div>

    <a href="pet-dashboard.html" class="back-link">
        ← Back
    </a>

</nav>


<div class="category-page">

    <div class="category-big-icon">
        💉
    </div>

    <h1>Vaccination</h1>

    <p>
        Add and manage your pet's vaccination details
    </p>


    <!-- ADD VACCINATION -->

    <div class="info-card">

        <h2>💉 Add Vaccination Details</h2>

        <form onsubmit="addVaccination(event)">

            <label>Vaccine Name</label>

            <input
                type="text"
                id="vaccineName"
                placeholder="e.g. Rabies Vaccine"
                required
            >


            <label>Vaccination Date</label>

            <input
                type="date"
                id="vaccinationDate"
                required
            >


            <label>Next Due Date</label>

            <input
                type="date"
                id="nextDueDate"
                required
            >


            <label>Veterinarian Name</label>

            <input
                type="text"
                id="vaccineDoctor"
                placeholder="e.g. Dr. Amit"
            >


            <button
                type="submit"
                class="save-pet-btn">

                💉 Add Vaccination

            </button>

        </form>

    </div>


    <!-- VACCINATION RECORDS -->

    <div class="info-card">

        <h2>📋 Vaccination Records</h2>

        <div id="vaccinationList">

            <p>
                No vaccination records added yet.
            </p>

        </div>

    </div>


</div>


<script src="../js/script.js"></script>

</body>

</html>
