<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawSense | Toys</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="main-nav">

        <div class="logo">
            🐾 PawSense
        </div>

        <a href="store.html" class="back-link">
            ← Store
        </a>

    </nav>


    <div class="category-page">

        <div class="category-big-icon">
            🧸
        </div>

        <h1>Pet Toys</h1>

        <p>
            Choose a toy type
        </p>


        <div class="shop-grid">


            <!-- CHEW TOY -->

            <div class="shop-card"
                 onclick="openToy('chew-toy.html')">

                <div class="shop-icon">
                    🦴
                </div>

                <h2>
                    Chew Toy
                </h2>

                <p>
                    Strong toys for chewing
                </p>

            </div>


            <!-- BALL TOY -->

            <div class="shop-card"
                 onclick="openToy('ball-toy.html')">

                <div class="shop-icon">
                    ⚽
                </div>

                <h2>
                    Ball Toy
                </h2>

                <p>
                    Fun balls for playing
                </p>

            </div>


            <!-- SOFT TOY -->

            <div class="shop-card"
                 onclick="openToy('soft-toy.html')">

                <div class="shop-icon">
                    🧸
                </div>

                <h2>
                    Soft Toy
                </h2>

                <p>
                    Soft and comfortable toys
                </p>

            </div>


        </div>

    </div>


    <script>

        function openToy(page) {

            window.location.href = page;

        }

    </script>

</body>

</html>
